<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Guides:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Contact</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>I'd love to connect!</h1>
      <form>
        <fieldset>
          <legend>Contact me.</legend>
          <p>All the fields are required.</p>
          <ul>
            <li class="form-list">
              <label for="name">Name</label>
              <input type="text" id="name" required autocomplete="name" />
            </li>
            <li class="form-list">
              <label for="email">Email</label>
              <input type="email" id="email" required autocomplete="email" />
            </li>
            <li class="form-list">
              <label for="subject">Subject</label>
              <input type="text" id="subject" required />
            </li>
            <li class="form-list">
              <label for="message">Message</label>
              <textarea id="message" required></textarea>
            </li>
          </ul>
          <div id="sendMessage">
            <label for="contact-title">Send a message</span>
            <input type="submit" value="Send" id="contact-title" />
          </div>
        </fieldset>
        <!-- Error message impelementaion, server connection need to be added in the future. -->
      </form>
    </main>
    <footer>
      <nav>
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
        </ul>
      </nav>
      <p>© Ken Sumiyoshi, 2026 - 202X</p>
    </footer>
  </body>
</html>
